name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: GhosttyKit (cached)
        uses: ./.github/actions/ghosttykit

      # The terminal end-to-end tests run tmux (on a private socket) over
      # SSH, against the system sshd and an in-process server.
      - name: Install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tmux

      # The ssh_config evaluator's tests compare it with OpenSSH 10's
      # `ssh -G` (the system ssh on this image is older); only those tests
      # use this ssh.
      - name: Install OpenSSH 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install openssh
          echo "RELAY_TEST_SSH=$(brew --prefix openssh)/bin/ssh" >> "$GITHUB_ENV"
          "$(brew --prefix openssh)/bin/ssh" -V

      # Real coding agents for the TUI tests (Tests/RelayGhosttyIOTests/
      # RealTUITests.swift), pinned. They run in a fresh home, showing
      # their first-run screens: no account needed. The probe program those
      # tests and the protocol parity suite use is Python 3, which the
      # runner has.
      - name: Install Claude Code and Codex
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.310 @openai/codex@0.163.0
          claude --version
          codex --version

      - name: Run tests
        env:
          RELAY_TEST_REQUIRE_TUIS: "1"
          RELAY_TEST_REQUIRE_OPENSSH10: "1"
        run: swift test

      # The highlighter's own suite also runs on Linux (below); here it runs
      # where the app does, including how an app finds its grammars.
      - name: Run highlighter tests
        working-directory: RelaySyntaxHighlighter
        run: swift test

  # Relay's libghostty patches (patches/ghostty) carry their own Zig unit
  # tests; this runs them against the pinned Ghostty source. The Swift suite
  # covers the same code through the C API and end to end.
  ghostty-patch:
    name: libghostty patch (Zig tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: Vendor/toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-libghostty.sh', 'patches/zig/**') }}

      - name: Run patch unit tests
        run: ./Scripts/build-libghostty.sh --test

  # The package's RelayKit product (everything below the Mac app's AppKit
  # layer) is what the iOS app builds on. This keeps it compiling for iOS,
  # against libghostty's iOS slices, which nothing upstream builds anymore
  # (docs/GHOSTTY_PIN.md, patch 0002).
  ios:
    name: iOS build (RelayKit)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: GhosttyKit with iOS slices (cached)
        uses: ./.github/actions/ghosttykit
        with:
          universal: "true"

      # The simulator slice is arm64 only, as upstream built it.
      - name: Build RelayKit for the iOS Simulator and devices
        run: |
          xcodebuild build -scheme RelayKit -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath .build/xcode -quiet
          xcodebuild build -scheme RelayKit -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/xcode -quiet

      # libghostty's iOS slice at run time: the manual I/O surface suite
      # (creating, feeding, rendering with Metal, resizing, tearing down) on
      # a simulator — the newest iOS runtime's first iPhone.
      - name: libghostty surface tests on the iOS Simulator
        run: |
          DEVICE="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(runtime): return [int(n) for n in re.findall(r"\d+", runtime.rsplit(".", 1)[-1])]
          for runtime in sorted((r for r in runtimes if ".iOS-" in r), key=version, reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          sys.exit("no iPhone simulator")
          ')"
          xcodebuild test -scheme RelayGhosttyIOTests -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath .build/xcode -resultBundlePath .build/ios-tests.xcresult -quiet
          # -quiet hides the results, and a run with no tests passes too.
          xcrun xcresulttool get test-results summary --path .build/ios-tests.xcresult --compact | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          device = summary["devicesAndConfigurations"][0]["device"]
          print("%s: %d passed, %d failed, %d skipped on %s (iOS %s)" % (summary["result"], summary["passedTests"],
                summary["failedTests"], summary["skippedTests"], device["modelName"], device["osVersion"]))
          sys.exit(0 if summary["result"] == "Passed" and summary["passedTests"] > 0 else 1)
          '

  # Both apps (App/project.yml), built unsigned as releases build them:
  # the direct download, and the App Store app (RelayUI in the App Sandbox,
  # without Sparkle). macOS 26, because compiling the Icon Composer icon
  # (Resources/Relay.icon) fails on the macOS 15 image.
  apps:
    name: Mac apps (Xcode)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: GhosttyKit (cached)
        uses: ./.github/actions/ghosttykit

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      # What each build exists for: the bundle ID, Keychain group and iCloud
      # container every Relay build shares, the resources, and what sets
      # the two apart (Scripts/check-app.py). Both are Relay.app, so each
      # is checked, then removed, before the next is built.
      - name: Build and check both apps (Release)
        run: |
          xcodegen --spec App/project.yml
          APP=.build/xcode-app/Build/Products/Release/Relay.app
          for scheme in "Relay Direct" Relay; do
            rm -rf "$APP"
            xcodebuild build -project App/Relay.xcodeproj -scheme "$scheme" -configuration Release \
              -destination 'generic/platform=macOS' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
              -derivedDataPath .build/xcode-app -quiet
            Scripts/check-app.py "$scheme" Release "$APP"
          done

  # RelaySyntaxHighlighter is a standalone, pure-Swift package (no AppKit, no
  # libghostty) — so its Prism fixture suite runs on a cheap Linux runner,
  # which also guards against swift-corelibs-foundation's NSRegularExpression
  # diverging from Apple's.
  highlighter-linux:
    name: Syntax highlighter (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Run highlighter fixture suite
        working-directory: RelaySyntaxHighlighter
        run: swift test
