name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: GhosttyKit (cached)
        uses: ./.github/actions/ghosttykit

      # The terminal end-to-end tests run tmux (on a private socket) over
      # SSH, against the system sshd and an in-process server.
      - name: Install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tmux

      # The ssh_config evaluator's tests compare it with OpenSSH 10's
      # `ssh -G` (the system ssh on this image is older); only those tests
      # use this ssh.
      - name: Install OpenSSH 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install openssh
          echo "RELAY_TEST_SSH=$(brew --prefix openssh)/bin/ssh" >> "$GITHUB_ENV"
          "$(brew --prefix openssh)/bin/ssh" -V

      # Real coding agents for the TUI tests (Tests/RelayGhosttyIOTests/
      # RealTUITests.swift), pinned. They run in a fresh home, showing
      # their first-run screens: no account needed. The probe program those
      # tests and the protocol parity suite use is Python 3, which the
      # runner has.
      - name: Install Claude Code and Codex
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.310 @openai/codex@0.163.0
          claude --version
          codex --version

      - name: Run tests
        env:
          RELAY_TEST_REQUIRE_TUIS: "1"
          RELAY_TEST_REQUIRE_OPENSSH10: "1"
        run: swift test

      - name: Build release binary
        run: swift build -c release --product Relay

  # Relay's libghostty patches (patches/ghostty) carry their own Zig unit
  # tests; this runs them against the pinned Ghostty source. The Swift suite
  # covers the same code through the C API and end to end.
  ghostty-patch:
    name: libghostty patch (Zig tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: Vendor/toolchain
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-libghostty.sh', 'patches/zig/**') }}

      - name: Run patch unit tests
        run: ./Scripts/build-libghostty.sh --test

  # RelaySyntaxHighlighter is a standalone, pure-Swift package (no AppKit, no
  # libghostty) — so its Prism fixture suite runs on a cheap Linux runner,
  # which also guards against swift-corelibs-foundation's NSRegularExpression
  # diverging from Apple's.
  highlighter-linux:
    name: Syntax highlighter (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Run highlighter fixture suite
        working-directory: RelaySyntaxHighlighter
        run: swift test
