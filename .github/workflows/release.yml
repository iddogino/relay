name: Release

# Releases are cut by pushing a tag:
#   v<semver>                     e.g. v0.1.0        -> stable release
#   v<semver>-<channel>.<seq>     e.g. v0.1.0-rc.1   -> prerelease
#
# The workflow tests, builds and Developer ID-signs Relay.app, packages a
# drag-to-Applications DMG, optionally notarizes it (when the APPLE_ID /
# APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD secrets are configured), and
# publishes a GitHub release with the DMG and checksums attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Parse release tag
        id: ver
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?$ ]]; then
            echo "error: tag '$TAG' is not v<semver> or v<semver>-<channel>.<sequence> (e.g. v0.1.0, v0.1.0-rc.1)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            if [[ "$VERSION" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: GhosttyKit (cached)
        uses: ./.github/actions/ghosttykit

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "error: MACOS_CERTIFICATE_P12 secret is not set (base64 of a .p12 containing a Developer ID Application identity)." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Apple's Developer ID intermediates are not preinstalled on runners;
          # without them codesign cannot build the certificate chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSLo "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build & sign Relay.app
        env:
          RELAY_VERSION: ${{ steps.ver.outputs.version }}
          RELAY_BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: "Developer ID Application"
        run: ./Scripts/build-app.sh release

      - name: Package DMG
        run: |
          brew install create-dmg
          DMG_NAME="Relay-${{ steps.ver.outputs.version }}.dmg"
          STAGING="build/dmg-staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R build/Relay.app "$STAGING/"
          # create-dmg drives Finder to lay out the window; that is
          # occasionally flaky on headless runners, so retry.
          for attempt in 1 2 3; do
            rm -f "build/$DMG_NAME"
            if create-dmg \
              --volname "Relay" \
              --volicon "Resources/AppIcon.icns" \
              --window-pos 200 160 \
              --window-size 560 400 \
              --icon-size 128 \
              --icon "Relay.app" 140 185 \
              --app-drop-link 420 185 \
              --hide-extension "Relay.app" \
              --hdiutil-quiet \
              "build/$DMG_NAME" "$STAGING"; then
              break
            fi
            echo "create-dmg attempt $attempt failed; retrying" >&2
            sleep 5
          done
          test -f "build/$DMG_NAME"
          codesign --force --sign "Developer ID Application" --timestamp "build/$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_PATH=build/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Notarize DMG
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Skipping notarization: APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD secrets not configured."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          (cd build && shasum -a 256 "$DMG_NAME" > SHA256SUMS.txt)

          {
            echo "## Install"
            echo
            echo "Download \`$DMG_NAME\` below, open it, and drag **Relay** into **Applications**."
            if [ "$NOTARIZED" != "true" ]; then
              echo
              echo "> This build is Developer ID-signed but not notarized: on first launch,"
              echo "> right-click Relay.app and choose **Open**."
            fi
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body || true
          } > "$RUNNER_TEMP/notes.md"

          FLAGS=(--title "Relay $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}" "$DMG_PATH" build/SHA256SUMS.txt
