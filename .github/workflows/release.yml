name: Release

# Releases are cut by pushing a tag:
#   v<semver>                     e.g. v0.1.0        -> stable release
#   v<semver>-<channel>.<seq>     e.g. v0.1.0-rc.1   -> prerelease
#
# The workflow tests, builds and Developer ID-signs Relay.app (the Xcode
# project's Relay Direct, with Scripts/archive-app.sh) with the tmux builds
# it installs on hosts, packages a drag-to-Applications DMG, notarizes it
# (the APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD secrets), and
# publishes a GitHub release with the DMG and checksums attached, then the
# appcast item that offers it to installed copies.
#
# A release that isn't notarized isn't published: without those secrets the
# run fails, unless the repository variable RELAY_ALLOW_UNNOTARIZED is
# "true" (the release notes then say so).
#
# Running a tag's workflow again is safe. The build number follows from the
# version (Scripts/release-version.py), and a DMG that's already published
# is never rebuilt — installed copies may have it, and the appcast's
# signature is of those bytes — so a re-run picks up where the last one
# stopped: it signs the published DMG and updates the appcast.
#
# The MACOS_PROVISIONING_PROFILE secret (base64 of the "Relay Developer ID"
# provisioning profile for com.iddogino.Relay) is embedded in the app and
# grants its Keychain access group and iCloud container: SSH keys and
# passwords sync through iCloud Keychain, hosts and projects through
# CloudKit.

on:
  push:
    tags: ["v*"]

# Least privilege: only the release job writes (the release, the appcast).
permissions:
  contents: read

# One release at a time: two tags pushed together would race for the
# appcast.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tests, as CI runs them.
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: GhosttyKit (cached)
        uses: ./.github/actions/ghosttykit

      # The terminal end-to-end tests run tmux over SSH (as in CI).
      - name: Install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tmux

      # The ssh_config evaluator's tests compare it with OpenSSH 10's
      # `ssh -G` (the system ssh on this image is older); only those tests
      # use this ssh.
      - name: Install OpenSSH 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install openssh
          echo "RELAY_TEST_SSH=$(brew --prefix openssh)/bin/ssh" >> "$GITHUB_ENV"
          "$(brew --prefix openssh)/bin/ssh" -V

      - name: Run tests
        env:
          RELAY_TEST_REQUIRE_OPENSSH10: "1"
        run: swift test

  # The Linux half of the tmux bundle (macOS runners have no Docker).
  tmux-linux:
    uses: ./.github/workflows/tmux-linux.yml

  release:
    name: Build, sign & publish
    needs: [test, tmux-linux]
    permissions:
      contents: write
    # macOS 26, as CI builds the apps: compiling the Icon Composer icon
    # (Resources/Relay.icon) fails on the macOS 15 image.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag's version and the build number that follows from it
      # (Scripts/release-version.py also refuses a tag that isn't one).
      - name: Parse release tag
        id: ver
        run: Scripts/release-version.py "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      # A DMG that's already out is the release: this run only finishes
      # what an earlier one didn't (the appcast).
      - name: Look for a published DMG
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          DMG_NAME="Relay-$VERSION.dmg"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_PATH=build/$DMG_NAME" >> "$GITHUB_ENV"
          mkdir -p build
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$DMG_NAME" --dir build 2>/dev/null; then
            echo "Release $TAG already has $DMG_NAME: not building it again."
            echo "dmg=true" >> "$GITHUB_OUTPUT"
          else
            echo "dmg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GhosttyKit (cached)
        if: steps.published.outputs.dmg != 'true'
        uses: ./.github/actions/ghosttykit

      # build/tmux, which the app bundles (Scripts/check-app.py insists).
      - name: tmux bundle
        if: steps.published.outputs.dmg != 'true'
        uses: ./.github/actions/tmux-bundle

      - name: Install XcodeGen
        if: steps.published.outputs.dmg != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Import signing certificate
        if: steps.published.outputs.dmg != 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "error: MACOS_CERTIFICATE_P12 secret is not set (base64 of a .p12 containing a Developer ID Application identity)." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Apple's Developer ID intermediates are not preinstalled on runners;
          # without them codesign cannot build the certificate chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSLo "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        if: steps.published.outputs.dmg != 'true'
        env:
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "error: MACOS_PROVISIONING_PROFILE secret is not set (base64 of the \"Relay Developer ID\" provisioning profile)." >&2
            exit 1
          fi
          PROFILE="$RUNNER_TEMP/relay.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > /dev/null
          echo "RELAY_PROVISIONING_PROFILE=$PROFILE" >> "$GITHUB_ENV"

      # Archived and exported Developer ID-signed, then checked as a
      # release must be (Scripts/check-app.py --distribution): Relay's
      # bundle ID, Keychain group, iCloud container and update feed, every
      # piece of code signed for notarization, iCloud and push in
      # Production.
      - name: Build & sign Relay.app
        if: steps.published.outputs.dmg != 'true'
        env:
          RELAY_VERSION: ${{ steps.ver.outputs.version }}
          RELAY_BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: ./Scripts/archive-app.sh

      - name: Package DMG
        if: steps.published.outputs.dmg != 'true'
        run: |
          brew install create-dmg
          STAGING="build/dmg-staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R build/Relay.app "$STAGING/"
          # create-dmg drives Finder to lay out the window; that is
          # occasionally flaky on headless runners, so retry.
          for attempt in 1 2 3; do
            rm -f "build/$DMG_NAME"
            if create-dmg \
              --volname "Relay" \
              --volicon "Resources/AppIcon.icns" \
              --window-pos 200 160 \
              --window-size 560 400 \
              --icon-size 128 \
              --icon "Relay.app" 140 185 \
              --app-drop-link 420 185 \
              --hide-extension "Relay.app" \
              --hdiutil-quiet \
              "build/$DMG_NAME" "$STAGING"; then
              break
            fi
            echo "create-dmg attempt $attempt failed; retrying" >&2
            sleep 5
          done
          test -f "build/$DMG_NAME"
          codesign --force --sign "Developer ID Application" --timestamp "build/$DMG_NAME"

      # The app inside is notarized with the DMG; the ticket is stapled to
      # the DMG.
      - name: Notarize DMG
        id: notarize
        if: steps.published.outputs.dmg != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ALLOW_UNNOTARIZED: ${{ vars.RELAY_ALLOW_UNNOTARIZED }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            if [ "$ALLOW_UNNOTARIZED" != "true" ]; then
              echo "error: can't notarize: the APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD secrets aren't all set." >&2
              echo "A release that isn't notarized would reach every installed copy through the appcast." >&2
              echo "Set the secrets, or the repository variable RELAY_ALLOW_UNNOTARIZED=true to publish one anyway." >&2
              exit 1
            fi
            echo "::warning::Publishing without notarization (RELAY_ALLOW_UNNOTARIZED)."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.published.outputs.dmg != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          (cd build && shasum -a 256 "$DMG_NAME" > SHA256SUMS.txt)

          {
            echo "## Install"
            echo
            echo "Download \`$DMG_NAME\` below, open it, and drag **Relay** into **Applications**."
            if [ "$NOTARIZED" != "true" ]; then
              echo
              echo "> This build is Developer ID-signed but not notarized: on first launch,"
              echo "> right-click Relay.app and choose **Open**."
            fi
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body || true
          } > "$RUNNER_TEMP/notes.md"

          FLAGS=(--title "Relay $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # An earlier run made the release but didn't get the DMG up.
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$DMG_PATH" build/SHA256SUMS.txt
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "${FLAGS[@]}" "$DMG_PATH" build/SHA256SUMS.txt
          fi

      # The appcast lives on main: checked out with the job's token
      # (never written into a URL or a file of ours).
      - name: Check out the appcast
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: appcast-repo
          fetch-depth: 1

      - name: Update appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          # Sparkle's own release archive, pinned: what signs the update
          # is handed the signing key.
          SPARKLE_VERSION: "2.9.6"
          SPARKLE_SHA256: 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "error: SPARKLE_ED_PRIVATE_KEY secret is not set (Sparkle appcast signing)." >&2
            exit 1
          fi
          curl -fsSLo "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c - >/dev/null || {
            echo "error: Sparkle-$SPARKLE_VERSION.tar.xz doesn't match its pinned checksum." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update
          # The key goes in on stdin: never on disk, never in an argument.
          SIG_LINE=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$DMG_PATH")
          SIGNATURE=$(printf '%s' "$SIG_LINE" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(printf '%s' "$SIG_LINE" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$SIGNATURE" ] || [ -z "$LENGTH" ]; then
            echo "error: could not parse sign_update output: $SIG_LINE" >&2
            exit 1
          fi
          CHANNEL_ARG=""
          if [ "$PRERELEASE" = "true" ]; then CHANNEL_ARG="--channel rc"; fi
          cd appcast-repo
          git config user.name "relay-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Made on the latest main each time, so a push that loses a race
          # is simply made again (the script replaces this build's item).
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            python3 ../Scripts/update-appcast.py \
              --appcast appcast.xml \
              --version "$BUILD_NUMBER" \
              --short-version "$VERSION" \
              --tag "$TAG" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$DMG_NAME" \
              --length "$LENGTH" \
              --signature "$SIGNATURE" \
              $CHANNEL_ARG
            if git diff --quiet -- appcast.xml; then
              echo "appcast already has build $BUILD_NUMBER as published."
              exit 0
            fi
            git add appcast.xml
            git commit -m "appcast: $TAG (build $BUILD_NUMBER)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "error: could not push appcast update" >&2
          exit 1
