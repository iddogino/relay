name: Website

# relayapp.sh — the site in website/, on Cloudflare Pages (project
# "relayapp"). It deploys:
#
#   - on a push to main that touches the site;
#   - after the Release workflow finishes, because /releases and every
#     download button are generated from the repository's GitHub releases;
#   - when a release is published, edited or deleted by hand (its notes
#     are the page's content);
#   - on demand (Actions ▸ Website ▸ Run workflow, from main).
#
# Pull requests that touch the site build it, without deploying.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN (a token
# with the account permission "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  # A release made by the Release workflow raises no `release` event (its
  # token can't start workflows); the workflow finishing does.
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# The newest deploy wins; a pull request's builds only replace each other.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  site:
    name: ${{ github.event_name == 'pull_request' && 'Build' || 'Build and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      # Release events run at the tag's commit; the site is always main's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || '' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Fetches the releases; fails rather than build a page without them.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
            exit 1
          fi
          npx wrangler pages deploy dist \
            --project-name relayapp \
            --branch main \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "$(git log -1 --pretty=%s)" \
            --commit-dirty=true
