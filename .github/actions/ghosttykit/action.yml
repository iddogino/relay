name: GhosttyKit
description: >
  Select the newest installed Xcode, then restore the pinned
  GhosttyKit.xcframework from cache — or build it from source on a cache miss.
  The cache key is derived from Scripts/build-libghostty.sh, so bumping the
  Ghostty pin (or the Zig toolchain) automatically invalidates it.

runs:
  using: composite
  steps:
    - name: Select newest Xcode
      shell: bash
      run: |
        XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
        if [ -n "$XCODE" ]; then
          sudo xcode-select -s "$XCODE/Contents/Developer"
        fi
        xcodebuild -version
        swift --version

    - name: Cache GhosttyKit
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          Vendor/ghostty/macos/GhosttyKit.xcframework
          Vendor/ghostty/zig-out/share
        key: ghosttykit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-libghostty.sh') }}

    - name: Build libghostty from source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./Scripts/build-libghostty.sh
